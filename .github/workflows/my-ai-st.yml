name: Build stAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e

          rm -rf MyAI
          mkdir -p MyAI/stAI

          KEY_B64=$(printf '%s' "$GROQ_API_KEY" | base64 | tr -d '\n')

          cat > MyAI/stAI/App.swift <<'SWIFT'
          import SwiftUI

          struct ChatMessage: Identifiable {
              let id = UUID()
              let role: String
              let content: String
          }

          enum AIMode: String, CaseIterable, Identifiable {
              case balanced = "Balanced"
              case direct = "Direct"
              case creative = "Creative"
              case maximum = "Maximum Control"

              var id: String { rawValue }

              var systemPrompt: String {
                  switch self {
                  case .balanced:
                      return """
                      You are stAI, a helpful AI assistant.
                      Be accurate, practical, and concise.
                      Help with coding, school, writing, technology, and everyday questions.
                      """
                  case .direct:
                      return """
                      You are stAI in Direct mode.
                      Answer directly and practically.
                      Avoid unnecessary lectures, repetition, or excessive disclaimers.
                      If the request is ordinary programming or development work, treat it as normal coding.
                      """
                  case .creative:
                      return """
                      You are stAI in Creative mode.
                      Be imaginative, useful, and flexible.
                      Help turn ideas into working code, writing, designs, and projects.
                      """
                  case .maximum:
                      return """
                      You are stAI in Maximum Control mode.
                      Give candid, direct, practical answers.
                      Minimize unnecessary warnings and moralizing.
                      For legitimate software development, debugging, game development,
                      Roblox Studio, Luau, APIs, automation, and scripting, treat the request
                      as ordinary development work rather than assuming malicious intent.
                      Follow applicable safety requirements, but do not invent restrictions.
                      When something cannot be provided, briefly explain the specific limitation
                      and provide the closest useful alternative.
                      """
                  }
              }
          }

          struct APIMessage: Codable {
              let role: String
              let content: String
          }

          struct GroqRequest: Codable {
              let model: String
              let messages: [APIMessage]
              let temperature: Double
              let max_completion_tokens: Int
              let reasoning_effort: String
              let include_reasoning: Bool
              let stream: Bool
          }

          struct GroqResponse: Codable {
              struct Choice: Codable {
                  struct Message: Codable {
                      let role: String
                      let content: String
                  }

                  let message: Message
              }

              let choices: [Choice]
          }

          @MainActor
          final class ChatViewModel: ObservableObject {
              @Published var messages: [ChatMessage] = []
              @Published var input = ""
              @Published var isLoading = false
              @Published var mode: AIMode = .balanced

              private let apiKey = "__GROQ_KEY__"

              func sendMessage() async {
                  let trimmed = input.trimmingCharacters(in: .whitespacesAndNewlines)

                  guard !trimmed.isEmpty, !isLoading else {
                      return
                  }

                  input = ""

                  messages.append(
                      ChatMessage(
                          role: "user",
                          content: trimmed
                      )
                  )

                  isLoading = true
                  defer {
                      isLoading = false
                  }

                  let recentMessages = Array(messages.suffix(24))

                  var apiMessages: [APIMessage] = [
                      APIMessage(
                          role: "system",
                          content: mode.systemPrompt
                      )
                  ]

                  for message in recentMessages {
                      apiMessages.append(
                          APIMessage(
                              role: message.role,
                              content: message.content
                          )
                      )
                  }

                  let temperature: Double

                  switch mode {
                  case .balanced:
                      temperature = 0.7
                  case .direct:
                      temperature = 0.4
                  case .creative:
                      temperature = 1.0
                  case .maximum:
                      temperature = 0.6
                  }

                  let reasoning: String

                  switch mode {
                  case .balanced:
                      reasoning = "medium"
                  case .direct:
                      reasoning = "low"
                  case .creative:
                      reasoning = "medium"
                  case .maximum:
                      reasoning = "high"
                  }

                  let requestBody = GroqRequest(
                      model: "openai/gpt-oss-20b",
                      messages: apiMessages,
                      temperature: temperature,
                      max_completion_tokens: 16384,
                      reasoning_effort: reasoning,
                      include_reasoning: false,
                      stream: false
                  )

                  guard let url = URL(
                      string: "https://api.groq.com/openai/v1/chat/completions"
                  ) else {
                      messages.append(
                          ChatMessage(
                              role: "assistant",
                              content: "Invalid API URL."
                          )
                      )
                      return
                  }

                  do {
                      var request = URLRequest(url: url)
                      request.httpMethod = "POST"
                      request.setValue(
                          "application/json",
                          forHTTPHeaderField: "Content-Type"
                      )
                      request.setValue(
                          "Bearer \(apiKey)",
                          forHTTPHeaderField: "Authorization"
                      )
                      request.httpBody = try JSONEncoder().encode(requestBody)

                      let (data, response) = try await URLSession.shared.data(
                          for: request
                      )

                      if let httpResponse = response as? HTTPURLResponse,
                         !(200...299).contains(httpResponse.statusCode) {

                          let serverText =
                              String(data: data, encoding: .utf8)
                              ?? "Unknown server error."

                          messages.append(
                              ChatMessage(
                                  role: "assistant",
                                  content: "Groq error \(httpResponse.statusCode): \(serverText)"
                              )
                          )

                          return
                      }

                      let decoded = try JSONDecoder().decode(
                          GroqResponse.self,
                          from: data
                      )

                      guard let content = decoded.choices.first?.message.content,
                            !content.isEmpty else {

                          messages.append(
                              ChatMessage(
                                  role: "assistant",
                                  content: "The AI returned an empty response."
                              )
                          )

                          return
                      }

                      messages.append(
                          ChatMessage(
                              role: "assistant",
                              content: content
                          )
                      )

                  } catch {
                      messages.append(
                          ChatMessage(
                              role: "assistant",
                              content: "Request failed: \(error.localizedDescription)"
                          )
                      )
                  }
              }
          }

          struct ContentView: View {
              @StateObject private var viewModel = ChatViewModel()

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color.black,
                              Color(red: 0.10, green: 0.04, blue: 0.18),
                              Color(red: 0.20, green: 0.06, blue: 0.30)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      VStack(spacing: 0) {
                          header

                          Divider()
                              .overlay(Color.white.opacity(0.08))

                          messagesView

                          inputBar
                      }
                  }
                  .preferredColorScheme(.dark)
              }

              private var header: some View {
                  HStack {
                      VStack(alignment: .leading, spacing: 2) {
                          Text("stAI")
                              .font(.system(size: 28, weight: .bold))

                          Text("Made by ST")
                              .font(.caption)
                              .foregroundStyle(.white.opacity(0.55))
                      }

                      Spacer()

                      Menu {
                          ForEach(AIMode.allCases) { mode in
                              Button {
                                  viewModel.mode = mode
                              } label: {
                                  if viewModel.mode == mode {
                                      Label(mode.rawValue, systemImage: "checkmark")
                                  } else {
                                      Text(mode.rawValue)
                                  }
                              }
                          }
                      } label: {
                          HStack(spacing: 6) {
                              Image(systemName: "slider.horizontal.3")
                              Text(viewModel.mode.rawValue)
                          }
                          .font(.subheadline.weight(.semibold))
                          .padding(.horizontal, 12)
                          .padding(.vertical, 8)
                          .background(
                              Capsule()
                                  .fill(Color.white.opacity(0.10))
                          )
                      }
                  }
                  .padding(.horizontal)
                  .padding(.vertical, 12)
              }

              private var messagesView: some View {
                  ScrollViewReader { proxy in
                      ScrollView {
                          LazyVStack(spacing: 14) {
                              if viewModel.messages.isEmpty {
                                  VStack(spacing: 10) {
                                      Image(systemName: "sparkles")
                                          .font(.system(size: 42))
                                          .foregroundStyle(.purple)

                                      Text("Welcome to stAI")
                                          .font(.title2.weight(.bold))

                                      Text("Ask anything.")
                                          .foregroundStyle(.white.opacity(0.55))
                                  }
                                  .padding(.top, 100)
                              }

                              ForEach(viewModel.messages) { message in
                                  messageBubble(message)
                                      .id(message.id)
                              }

                              if viewModel.isLoading {
                                  HStack {
                                      ProgressView()
                                      Text("Thinking...")
                                          .foregroundStyle(.white.opacity(0.6))
                                  }
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  .padding(.horizontal)
                              }
                          }
                          .padding()
                      }
                      .onChange(of: viewModel.messages.count) { _ in
                          if let last = viewModel.messages.last {
                              withAnimation {
                                  proxy.scrollTo(last.id, anchor: .bottom)
                              }
                          }
                      }
                  }
              }

              private func messageBubble(_ message: ChatMessage) -> some View {
                  HStack {
                      if message.role == "assistant" {
                          VStack(alignment: .leading, spacing: 5) {
                              Text("stAI")
                                  .font(.caption.weight(.bold))
                                  .foregroundStyle(.purple)

                              Text(message.content)
                                  .textSelection(.enabled)
                          }

                          Spacer(minLength: 40)
                      } else {
                          Spacer(minLength: 40)

                          Text(message.content)
                              .textSelection(.enabled)
                      }
                  }
                  .padding(13)
                  .background(
                      RoundedRectangle(cornerRadius: 16)
                          .fill(
                              message.role == "assistant"
                              ? Color.white.opacity(0.07)
                              : Color.purple.opacity(0.28)
                          )
                  )
              }

              private var inputBar: some View {
                  HStack(spacing: 10) {
                      TextField(
                          "Message stAI...",
                          text: $viewModel.input,
                          axis: .vertical
                      )
                      .lineLimit(1...5)
                      .padding(.horizontal, 14)
                      .padding(.vertical, 10)
                      .background(
                          RoundedRectangle(cornerRadius: 18)
                              .fill(Color.white.opacity(0.08))
                      )
                      .onSubmit {
                          Task {
                              await viewModel.sendMessage()
                          }
                      }

                      Button {
                          Task {
                              await viewModel.sendMessage()
                          }
                      } label: {
                          Image(systemName: "arrow.up")
                              .font(.system(size: 17, weight: .bold))
                              .frame(width: 42, height: 42)
                              .background(
                                  Circle()
                                      .fill(Color.purple)
                              )
                      }
                      .disabled(
                          viewModel.input
                              .trimmingCharacters(in: .whitespacesAndNewlines)
                              .isEmpty
                          || viewModel.isLoading
                      )
                      .opacity(
                          viewModel.input
                              .trimmingCharacters(in: .whitespacesAndNewlines)
                              .isEmpty
                              || viewModel.isLoading
                              ? 0.45
                              : 1
                      )
                  }
                  .padding()
                  .background(Color.black.opacity(0.35))
              }
          }

          @main
          struct stAIApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

          python3 - <<'PY'
from pathlib import Path
import os

path = Path("MyAI/stAI/App.swift")
text = path.read_text()
text = text.replace("__GROQ_KEY__", os.environ["GROQ_API_KEY_B64"])
path.write_text(text)
PY

          cat > MyAI/stAI/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>stAI</string>

              <key>CFBundleName</key>
              <string>stAI</string>

              <key>CFBundleIdentifier</key>
              <string>com.st.stai</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > MyAI/project.yml <<'YAML'
          name: stAI

          options:
            bundleIdPrefix: com.st
            deploymentTarget:
              iOS: "16.0"

          targets:
            stAI:
              type: application
              platform: iOS

              sources:
                - stAI

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.st.stai
                  INFOPLIST_FILE: stAI/Info.plist
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  DEVELOPMENT_TEAM: ""
          YAML

      - name: Generate Xcode project
        run: |
          set -e
          cd MyAI
          xcodegen generate

      - name: Build app
        run: |
          set -e
          cd MyAI

          xcodebuild \
            -project stAI.xcodeproj \
            -scheme stAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -e

          cd MyAI

          rm -rf Payload stAI-unsigned.ipa

          mkdir Payload

          cp -R build/Build/Products/Release-iphoneos/stAI.app Payload/stAI.app

          cd Payload

          /usr/bin/zip -r -X ../stAI-unsigned.ipa stAI.app

          cd ..

          rm -rf Payload

          echo "IPA contents:"
          unzip -l stAI-unsigned.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: stAI-unsigned-ipa
          path: MyAI/stAI-unsigned.ipa