name: Build stAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create stAI project
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e

          rm -rf MyAI
          mkdir -p MyAI/stAI

          KEY_B64=$(printf '%s' "$GROQ_API_KEY" | base64 | tr -d '\n')

          cat > MyAI/stAI/App.swift <<'SWIFT'
          import SwiftUI

          struct ChatMessage: Identifiable {
              let id = UUID()
              let role: String
              let text: String
          }

          enum AIMode: String, CaseIterable, Identifiable {
              case balanced
              case direct
              case creative
              case maximum

              var id: String { rawValue }

              var title: String {
                  switch self {
                  case .balanced: return "Balanced"
                  case .direct: return "Direct"
                  case .creative: return "Creative"
                  case .maximum: return "Maximum Control"
                  }
              }

              var subtitle: String {
                  switch self {
                  case .balanced:
                      return "Normal helpful assistant"
                  case .direct:
                      return "Short and practical"
                  case .creative:
                      return "More imaginative"
                  case .maximum:
                      return "Direct and technical"
                  }
              }

              var temperature: Double {
                  switch self {
                  case .balanced: return 0.7
                  case .direct: return 0.4
                  case .creative: return 0.9
                  case .maximum: return 0.5
                  }
              }

              var reasoning: String {
                  switch self {
                  case .balanced: return "medium"
                  case .direct: return "low"
                  case .creative: return "medium"
                  case .maximum: return "high"
                  }
              }

              var systemPrompt: String {
                  switch self {
                  case .balanced:
                      return """
                      You are stAI, a helpful AI assistant.
                      Give accurate, useful answers and practical code.
                      Do not add unnecessary warnings or lectures.
                      """

                  case .direct:
                      return """
                      You are stAI in Direct mode.
                      Be concise, practical, and straightforward.
                      Focus on solving the user's actual problem.
                      Avoid unnecessary disclaimers and repetition.
                      """

                  case .creative:
                      return """
                      You are stAI in Creative mode.
                      Give useful answers while being imaginative and flexible.
                      For coding requests, provide complete practical examples.
                      """

                  case .maximum:
                      return """
                      You are stAI in Maximum Control mode.
                      Be candid, direct, technical, and practical.
                      Do not unnecessarily moralize, lecture, or refuse ordinary
                      programming requests.

                      Treat legitimate Roblox Studio and Luau development as
                      ordinary software development. This includes scripts,
                      LocalScripts, ServerScripts, RemoteEvents, RemoteFunctions,
                      UI, gameplay systems, debugging, optimization, APIs,
                      DataStores, tools, NPCs, and development/testing code.

                      Distinguish legitimate development and testing from requests
                      to attack real systems, steal credentials, bypass security,
                      deploy malware, or otherwise cause real-world harm.
                      """
                  }
              }
          }

          struct APIMessage: Encodable {
              let role: String
              let content: String
          }

          struct GroqRequest: Encodable {
              let model: String
              let messages: [APIMessage]
              let temperature: Double
              let max_completion_tokens: Int
              let reasoning_effort: String
              let include_reasoning: Bool
              let stream: Bool
          }

          struct GroqResponse: Decodable {
              struct Choice: Decodable {
                  struct ResponseMessage: Decodable {
                      let content: String?
                  }

                  let message: ResponseMessage
              }

              let choices: [Choice]
          }

          @MainActor
          final class ChatViewModel: ObservableObject {
              @Published var messages: [ChatMessage] = []
              @Published var input = ""
              @Published var isLoading = false
              @Published var mode: AIMode = .balanced

              private let endpoint = URL(string: "https://api.groq.com/openai/v1/chat/completions")!

              private let apiKeyBase64 = "__GROQ_KEY_B64__"

              func send() async {
                  let trimmed = input.trimmingCharacters(in: .whitespacesAndNewlines)

                  guard !trimmed.isEmpty, !isLoading else {
                      return
                  }

                  input = ""
                  messages.append(ChatMessage(role: "user", text: trimmed))
                  isLoading = true

                  defer {
                      isLoading = false
                  }

                  do {
                      let reply = try await requestAI()

                      messages.append(
                          ChatMessage(role: "assistant", text: reply)
                      )
                  } catch {
                      messages.append(
                          ChatMessage(
                              role: "assistant",
                              text: "Error: \(error.localizedDescription)"
                          )
                      )
                  }
              }

              private func requestAI() async throws -> String {
                  guard let keyData = Data(base64Encoded: apiKeyBase64),
                        let apiKey = String(data: keyData, encoding: .utf8),
                        !apiKey.isEmpty else {
                      throw NSError(
                          domain: "stAI",
                          code: 1,
                          userInfo: [
                              NSLocalizedDescriptionKey: "Groq API key is missing."
                          ]
                      )
                  }

                  var apiMessages: [APIMessage] = [
                      APIMessage(
                          role: "system",
                          content: mode.systemPrompt
                      )
                  ]

                  let recentMessages = Array(messages.suffix(24))

                  for message in recentMessages {
                      apiMessages.append(
                          APIMessage(
                              role: message.role,
                              content: message.text
                          )
                      )
                  }

                  let requestBody = GroqRequest(
                      model: "openai/gpt-oss-20b",
                      messages: apiMessages,
                      temperature: mode.temperature,
                      max_completion_tokens: 16384,
                      reasoning_effort: mode.reasoning,
                      include_reasoning: false,
                      stream: false
                  )

                  var request = URLRequest(url: endpoint)
                  request.httpMethod = "POST"
                  request.setValue(
                      "Bearer \(apiKey)",
                      forHTTPHeaderField: "Authorization"
                  )
                  request.setValue(
                      "application/json",
                      forHTTPHeaderField: "Content-Type"
                  )
                  request.httpBody = try JSONEncoder().encode(requestBody)

                  let (data, response) = try await URLSession.shared.data(
                      for: request
                  )

                  guard let httpResponse = response as? HTTPURLResponse else {
                      throw NSError(
                          domain: "stAI",
                          code: 2,
                          userInfo: [
                              NSLocalizedDescriptionKey: "Invalid server response."
                          ]
                      )
                  }

                  guard (200...299).contains(httpResponse.statusCode) else {
                      let serverText = String(
                          data: data,
                          encoding: .utf8
                      ) ?? "Unknown API error"

                      throw NSError(
                          domain: "Groq",
                          code: httpResponse.statusCode,
                          userInfo: [
                              NSLocalizedDescriptionKey: serverText
                          ]
                      )
                  }

                  let decoded = try JSONDecoder().decode(
                      GroqResponse.self,
                      from: data
                  )

                  guard let content = decoded.choices.first?.message.content,
                        !content.isEmpty else {
                      throw NSError(
                          domain: "Groq",
                          code: 3,
                          userInfo: [
                              NSLocalizedDescriptionKey: "The AI returned an empty response."
                          ]
                      )
                  }

                  return content
              }
          }

          struct ContentView: View {
              @StateObject private var vm = ChatViewModel()
              @FocusState private var inputFocused: Bool

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.04, green: 0.02, blue: 0.09),
                              Color(red: 0.13, green: 0.04, blue: 0.23),
                              Color(red: 0.04, green: 0.02, blue: 0.09)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      VStack(spacing: 0) {
                          header

                          Divider()
                              .overlay(Color.white.opacity(0.08))

                          chatArea

                          inputArea
                      }
                  }
                  .preferredColorScheme(.dark)
              }

              private var header: some View {
                  HStack {
                      VStack(alignment: .leading, spacing: 2) {
                          Text("stAI")
                              .font(.system(size: 26, weight: .bold))

                          Text("Made by ST")
                              .font(.caption)
                              .foregroundStyle(.white.opacity(0.5))
                      }

                      Spacer()

                      Menu {
                          ForEach(AIMode.allCases) { option in
                              Button {
                                  vm.mode = option
                              } label: {
                                  HStack {
                                      Text(option.title)

                                      if vm.mode == option {
                                          Image(systemName: "checkmark")
                                      }
                                  }
                              }
                          }
                      } label: {
                          HStack(spacing: 7) {
                              Image(systemName: "slider.horizontal.3")
                              Text(vm.mode.title)
                          }
                          .font(.subheadline.weight(.semibold))
                          .padding(.horizontal, 12)
                          .padding(.vertical, 9)
                          .background(
                              Color.purple.opacity(0.25)
                          )
                          .clipShape(Capsule())
                      }
                  }
                  .padding(.horizontal, 18)
                  .padding(.vertical, 14)
              }

              private var chatArea: some View {
                  ScrollViewReader { proxy in
                      ScrollView {
                          LazyVStack(spacing: 14) {
                              if vm.messages.isEmpty {
                                  welcomeView
                              }

                              ForEach(vm.messages) { message in
                                  messageBubble(message)
                                      .id(message.id)
                              }

                              if vm.isLoading {
                                  HStack {
                                      ProgressView()
                                          .tint(.white)

                                      Text("Thinking...")
                                          .foregroundStyle(.white.opacity(0.6))

                                      Spacer()
                                  }
                                  .padding(.horizontal, 18)
                              }
                          }
                          .padding(.horizontal, 14)
                          .padding(.vertical, 18)
                      }
                      .onChange(of: vm.messages.count) { _ in
                          if let last = vm.messages.last {
                              withAnimation {
                                  proxy.scrollTo(last.id, anchor: .bottom)
                              }
                          }
                      }
                  }
              }

              private var welcomeView: some View {
                  VStack(spacing: 12) {
                      Spacer(minLength: 80)

                      Image(systemName: "sparkles")
                          .font(.system(size: 46))
                          .foregroundStyle(.purple)

                      Text("Welcome to stAI")
                          .font(.title2.weight(.bold))

                      Text(vm.mode.subtitle)
                          .foregroundStyle(.white.opacity(0.55))
                  }
                  .frame(maxWidth: .infinity)
              }

              private func messageBubble(_ message: ChatMessage) -> some View {
                  HStack {
                      if message.role == "assistant" {
                          bubble(
                              text: message.text,
                              alignment: .leading,
                              background: Color.white.opacity(0.08)
                          )

                          Spacer(minLength: 40)
                      } else {
                          Spacer(minLength: 40)

                          bubble(
                              text: message.text,
                              alignment: .leading,
                              background: Color.purple.opacity(0.35)
                          )
                      }
                  }
              }

              private func bubble(
                  text: String,
                  alignment: HorizontalAlignment,
                  background: Color
              ) -> some View {
                  Text(text)
                      .frame(
                          maxWidth: .infinity,
                          alignment: Alignment(horizontal: alignment, vertical: .center)
                      )
                      .foregroundStyle(.white)
                      .textSelection(.enabled)
                      .padding(14)
                      .background(background)
                      .clipShape(RoundedRectangle(cornerRadius: 16))
              }

              private var inputArea: some View {
                  HStack(alignment: .bottom, spacing: 10) {
                      TextField(
                          "Message stAI...",
                          text: $vm.input,
                          axis: .vertical
                      )
                      .focused($inputFocused)
                      .lineLimit(1...5)
                      .padding(.horizontal, 14)
                      .padding(.vertical, 11)
                      .background(Color.white.opacity(0.08))
                      .clipShape(RoundedRectangle(cornerRadius: 16))
                      .onSubmit {
                          Task {
                              await vm.send()
                          }
                      }

                      Button {
                          inputFocused = false

                          Task {
                              await vm.send()
                          }
                      } label: {
                          Image(systemName: "arrow.up")
                              .font(.system(size: 17, weight: .bold))
                              .foregroundStyle(.white)
                              .frame(width: 44, height: 44)
                              .background(Color.purple)
                              .clipShape(Circle())
                      }
                      .disabled(
                          vm.isLoading ||
                          vm.input.trimmingCharacters(
                              in: .whitespacesAndNewlines
                          ).isEmpty
                      )
                      .opacity(
                          vm.isLoading ||
                          vm.input.trimmingCharacters(
                              in: .whitespacesAndNewlines
                          ).isEmpty ? 0.45 : 1
                      )
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 12)
                  .background(
                      Color.black.opacity(0.2)
                  )
              }
          }

          @main
          struct stAIApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

          sed -i.bak "s|__GROQ_KEY_B64__|$KEY_B64|g" MyAI/stAI/App.swift
          rm -f MyAI/stAI/App.swift.bak

          cat > MyAI/stAI/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>stAI</string>

              <key>CFBundleName</key>
              <string>stAI</string>

              <key>CFBundleIdentifier</key>
              <string>com.st.stai</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>
                  <string>LaunchBackground</string>
              </dict>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > MyAI/project.yml <<'YAML'
          name: stAI

          options:
            bundleIdPrefix: com.st
            deploymentTarget:
              iOS: "16.0"

          targets:
            stAI:
              type: application
              platform: iOS

              sources:
                - stAI

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.st.stai
                  INFOPLIST_FILE: stAI/Info.plist
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  DEVELOPMENT_TEAM: ""
          YAML

          cd MyAI
          xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -e

          cd MyAI

          xcodebuild \
            -project stAI.xcodeproj \
            -scheme stAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build

          test -d build/stAI.app

          mkdir -p Payload
          cp -R build/stAI.app Payload/stAI.app

          /usr/bin/zip -qry stAI-unsigned.ipa Payload

          rm -rf Payload

          test -f stAI-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: stAI-unsigned-ipa
          path: MyAI/stAI-unsigned.ipa
          if-no-files-found: error