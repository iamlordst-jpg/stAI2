name: Build stAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Groq key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is missing."
            exit 1
          fi

      - name: Create iOS project
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e

          mkdir -p MyAI/stAI

          KEY_B64=$(printf '%s' "$GROQ_API_KEY" | base64 | tr -d '\n')

          cat > MyAI/stAI/App.swift.b64 <<'EOF'
PASTE_SWIFT_BASE64_HERE
EOF

          base64 --decode < MyAI/stAI/App.swift.b64 > MyAI/stAI/App.swift
          rm -f MyAI/stAI/App.swift.b64

          sed -i.bak "s/__GROQ_KEY_B64__/$KEY_B64/g" MyAI/stAI/App.swift
          rm -f MyAI/stAI/App.swift.bak

          cat > MyAI/stAI/Info.plist <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDisplayName</key>
    <string>stAI</string>

    <key>CFBundleIdentifier</key>
    <string>com.st.stai</string>

    <key>CFBundleName</key>
    <string>stAI</string>

    <key>CFBundlePackageType</key>
    <string>APPL</string>

    <key>CFBundleShortVersionString</key>
    <string>3.1</string>

    <key>CFBundleVersion</key>
    <string>31</string>

    <key>LSRequiresIPhoneOS</key>
    <true/>

    <key>UILaunchScreen</key>
    <dict/>

    <key>UIRequiresFullScreen</key>
    <true/>

    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
    </array>
</dict>
</plist>
PLIST

          cat > MyAI/project.yml <<'PROJECT'
name: stAI

options:
  bundleIdPrefix: com.st
  deploymentTarget:
    iOS: "16.0"

targets:
  stAI:
    type: application
    platform: iOS

    sources:
      - stAI

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.st.stai
        INFOPLIST_FILE: stAI/Info.plist
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
PROJECT

          brew install xcodegen

          cd MyAI
          xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -e

          cd MyAI

          xcodebuild \
            -project stAI.xcodeproj \
            -scheme stAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build

          mkdir -p Payload

          cp -R build/stAI.app Payload/stAI.app

          /usr/bin/zip -qry stAI-unsigned.ipa Payload

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: stAI-unsigned-ipa
          path: MyAI/stAI-unsigned.ipa